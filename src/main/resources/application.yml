server:
  port: ${PORT:8080}

spring:
  application:
    name: retos-tecnicos
  datasource:
    url: ${DB_URL:jdbc:h2:mem:retos;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD:200MB}
      max-request-size: ${MAX_UPLOAD:200MB}
  # SMTP (por defecto Brevo: smtp-relay.brevo.com:587). Sin SMTP_HOST el resumen solo se escribe en el log.
  mail:
    host: ${SMTP_HOST:smtp-relay.sendinblue.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:bf1baa001@smtp-brevo.com}
    password: ${SMTP_PASSWORD:xsmtpsib-eaab4769af734144fccde6691b65327b33530ac16ca67fbfa0db9198a831eebf-3KAFivG5dW8hEqUS}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.starttls.required: ${SMTP_STARTTLS:true}
      # En milisegundos: un SMTP caido no deja hilos colgados
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

storage:
  type: ${STORAGE_TYPE:azure}
  azure:
    connection-string: ${AZURE_STORAGE_CONNECTION_STRING:DefaultEndpointsProtocol=https;EndpointSuffix=core.windows.net;AccountName=retostecnicosjose;AccountKey=/KozGaMSqFs7QNiSvb9BFHnhoUpUz5Qi1nNcaRONH6wK4rUaXa9G9Jt0fc9uFmEYYejN9WX+cgeS+AStdrsYMA==;BlobEndpoint=https://retostecnicosjose.blob.core.windows.net/}
    container: ${AZURE_STORAGE_CONTAINER:retos}
  local:
    root: ${STORAGE_LOCAL_ROOT:./storage-local}

app:
  timezone: America/Lima
  # URL publica del frontend; se usa para el enlace a la pantalla de Retos en el correo
  base-url: ${APP_BASE_URL:http://localhost:4200}
  validation:
    email-mx-check: ${EMAIL_MX_CHECK:false}
  jwt:
    secret: ${JWT_SECRET:cambia-este-secreto-por-uno-de-minimo-32-caracteres!}
    ttl-minutes: 480
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
  challenge:
    duration-minutes: 180
    grace-seconds: 60
    expire-check-ms: 30000
  notification:
    from: ${MAIL_FROM:jose.zegarra@vallegrande.edu.pe}
    extra-recipients: ${GHD_EXTRA_EMAILS:}
  seed:
    admin-password: ${ADMIN_PASSWORD:Admin123!}
    ghd-password: ${GHD_PASSWORD:Ghd12345!}
    ghd-email: ${GHD_EMAIL:}
