name: CI-CD to ACR and App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ACR_NAME: kyndrylacrlab
  IMAGE_NAME: back-retos
  APP_SERVICE_NAME: app-back-retos
  RESOURCE_GROUP: kyndrylresource

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name "${{ env.ACR_NAME }}"

      - name: Build Docker image
        run: |
          docker build \
            -t "${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.image_tag }}" \
            .

      - name: Push Docker image to ACR
        run: |
          docker push \
            "${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.image_tag }}"

      - name: Show published image
        run: |
          echo "Image published:"
          echo "${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.image_tag }}"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure container port
        run: |
          az webapp config appsettings set \
            --name "${{ env.APP_SERVICE_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --settings WEBSITES_PORT=8080

      - name: Configure Web App container
        run: |
          az webapp config container set \
            --name "${{ env.APP_SERVICE_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --docker-custom-image-name "${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image_tag }}" \
            --docker-registry-server-url "https://${{ env.ACR_NAME }}.azurecr.io"

      - name: Deploy Docker image to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_SERVICE_NAME }}
          images: ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image_tag }}

      - name: Restart Web App
        run: |
          az webapp restart \
            --name "${{ env.APP_SERVICE_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}"
